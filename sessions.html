<title>MH ELITE PRO — الحصص الخاصة</title>
<style>
:root{--bg:#05080d;--card:#0e1724;--card2:#111c2b;--line:#223044;--mut:#93a3b8;--ink:#f6f8fb;--gold:#f5c842;--gold2:#d9a93a;--green:#3ddc84;--red:#ff6b6b;--blue:#4fc3f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 80% 40% at 50% 0,rgba(245,200,66,.18),transparent 70%),linear-gradient(180deg,#07101c,#030509);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5;padding:max(12px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{width:min(560px,100%);margin:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:10px}
.top img{width:40px;height:40px;border-radius:11px;box-shadow:0 0 0 1.5px rgba(245,200,66,.5)}
.top b{font-size:15px;letter-spacing:.3px;direction:ltr}.top b span{color:var(--gold)}
.top .sp{flex:1}
.chip{border:1px solid #2e4058;background:#0d1622;color:#dbe6f3;border-radius:999px;padding:7px 13px;font-weight:700;font-size:12px}
h1{font-size:26px;line-height:1.3;margin:22px 0 6px}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:#c3cfdd;font-size:14px;margin:0}
.card{margin-top:16px;padding:16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(150deg,var(--card2),#090f18)}
.card h2{font-size:16px;margin:0 0 12px}
/* packages */
.pk{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pk button{position:relative;border:1.5px solid var(--line);background:linear-gradient(150deg,#121e2e,#0a111b);border-radius:22px;padding:20px 12px 16px;text-align:center;transition:.15s}
.pk button:active{transform:scale(.97)}
.pk button.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,200,66,.18)}
.pk .n{display:block;font-size:44px;font-weight:900;color:var(--gold);line-height:1}
.pk .l{display:block;font-weight:800;font-size:15px;margin-top:6px}
.pk .d{display:block;color:var(--mut);font-size:12px;margin-top:3px}
/* form */
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .full{grid-column:1/-1}
label{display:block;font-size:12.5px;color:#b5c2d2;margin-bottom:5px;font-weight:700}
input,select,textarea{width:100%;background:#0a121d;border:1.5px solid #243448;border-radius:13px;padding:12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}
.req{color:var(--gold)}
.err{border-color:var(--red)!important}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:16px;min-height:54px}
.btn.gold{background:linear-gradient(135deg,#ffe08a,#f5c842 50%,#d9a93a);color:#1a1200;box-shadow:0 10px 26px rgba(245,200,66,.25)}
.btn.wa{background:linear-gradient(135deg,#6ff0a8,#3ddc84 50%,#1fa864);color:#04220f;box-shadow:0 10px 26px rgba(61,220,132,.25)}
.btn.ghost{background:transparent;border:1.5px solid #2e4058;color:#dbe6f3;font-weight:800;font-size:14px;min-height:46px;padding:11px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}
/* progress */
.prog{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:#1a2738}.ring .fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{font-size:26px;line-height:1;direction:ltr;unicode-bidi:isolate;display:inline-block}.ring .t small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
.who b{display:block;font-size:19px}
.who span{display:block;color:var(--mut);font-size:13px}
.who .pill{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:999px;background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.35);color:var(--gold);font-weight:800;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:15px;border:1.5px solid #243448;background:#0a121d;color:#6f8098;position:relative}
.cell.done{background:linear-gradient(135deg,#3ddc84,#1fa864);border-color:transparent;color:#04220f}
.cell.done:after{content:"✓";position:absolute;top:2px;inset-inline-end:5px;font-size:10px}
.cell.next{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 3px rgba(245,200,66,.15)}
.big{margin-top:16px}
.log{margin:0;padding:0;list-style:none}
.log li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13.5px}
.log li:first-child{border-top:0}
.log .no{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:rgba(61,220,132,.14);color:var(--green)}
.log .tx{flex:1;min-width:0}
.log .tx small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .fe{font-size:20px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:8px}
.done-card{text-align:center}
.done-card .tro{font-size:56px;line-height:1}
.done-card h2{font-size:22px;margin:8px 0 4px}
.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(79,195,247,.08);border:1px solid rgba(79,195,247,.3);color:#cfeaf8;font-size:12.5px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:22px}
.lnk{background:none;border:0;color:#8fa3bb;font-size:12.5px;text-decoration:underline;padding:6px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);background:linear-gradient(180deg,#132033,#0a111b);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 12px;color:var(--mut);font-size:13px}
.feel{display:flex;justify-content:space-between;gap:6px;margin:8px 0 14px}
.feel button{flex:1;border:1.5px solid #243448;background:#0a121d;border-radius:14px;padding:9px 0 7px;font-size:26px;line-height:1}
.feel button small{display:block;font-size:10.5px;color:var(--mut);margin-top:5px;font-weight:700}
.feel button.on{border-color:var(--gold);background:rgba(245,200,66,.12)}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#163426;color:#bff7d8;border:1px solid #36d98b66;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;transition:.2s;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d9a93a"/></linearGradient></defs></svg>
<div class="wrap">
 <div class="top"><img id="logo" alt=""><b>MH ELITE <span>PRO</span></b><span class="sp"></span><button type="button" class="chip" id="lang"></button></div>

 <!-- step 1: choose package -->
 <section id="vPick" hidden>
  <h1 data-t="pickT"></h1>
  <p class="sub" data-t="pickP"></p>
  <div class="pk" id="pk"></div>
 </section>

 <!-- step 2: register -->
 <section id="vReg" hidden>
  <h1 id="regT"></h1>
  <p class="sub" data-t="regP"></p>
  <form class="card" id="reg" novalidate>
   <div class="f">
    <div class="full"><label><span data-t="fName"></span> <span class="req">*</span></label><input id="fName" autocomplete="name" maxlength="60"></div>
    <div><label><span data-t="fAge"></span> <span class="req">*</span></label><input id="fAge" type="number" inputmode="numeric" min="10" max="90"></div>
    <div><label><span data-t="fGender"></span> <span class="req">*</span></label><select id="fGender"></select></div>
    <div><label><span data-t="fWeight"></span> <span class="req">*</span></label><input id="fWeight" type="number" inputmode="decimal" min="25" max="300" step="0.1"></div>
    <div><label data-t="fHeight"></label><input id="fHeight" type="number" inputmode="decimal" min="100" max="230"></div>
    <div class="full"><label><span data-t="fGoal"></span> <span class="req">*</span></label><select id="fGoal"></select></div>
    <div><label data-t="fLevel"></label><select id="fLevel"></select></div>
    <div><label data-t="fDays"></label><select id="fDays"></select></div>
    <div class="full"><label data-t="fInj"></label><textarea id="fInj" maxlength="300"></textarea></div>
   </div>
   <button type="submit" class="btn gold big" data-t="regBtn"></button>
   <div class="row"><button type="button" class="btn ghost" id="back" data-t="back"></button></div>
  </form>
 </section>

 <!-- step 3: track -->
 <section id="vTrack" hidden>
  <div class="card">
   <div class="prog">
    <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="arc" cx="60" cy="60" r="52"/></svg><div class="t"><div><b id="cnt"></b><small data-t="sessions"></small></div></div></div>
    <div class="who"><b id="wName"></b><span id="wInfo"></span><span class="pill" id="wPk"></span></div>
   </div>
  </div>
  <div id="doneBox" class="card done-card" hidden>
   <div class="tro">🏆</div>
   <h2 data-t="doneT"></h2>
   <p class="sub" data-t="doneP"></p>
   <button type="button" class="btn wa big" id="sendFinal"></button>
   <div class="row"><button type="button" class="btn ghost" id="newPk" data-t="newPk"></button></div>
  </div>
  <button type="button" class="btn gold big" id="complete"></button>
  <div class="card"><h2 data-t="gridT"></h2><div class="grid" id="grid"></div></div>
  <div class="card"><h2 data-t="logT"></h2><ul class="log" id="log"></ul></div>
  <div class="note" data-t="note"></div>
  <div class="foot"><button type="button" class="lnk" id="undo" data-t="undo"></button> · <button type="button" class="lnk" id="edit" data-t="edit"></button> · <button type="button" class="lnk" id="reset" data-t="reset"></button></div>
 </section>
 <div class="foot" data-t="coach"></div>
</div>

<!-- complete sheet -->
<div class="ov" id="ov" hidden>
 <div class="sheet" role="dialog" aria-modal="true">
  <h3 id="shT"></h3>
  <p data-t="shP"></p>
  <label data-t="feelL"></label>
  <div class="feel" id="feel"></div>
  <label data-t="noteL"></label>
  <textarea id="sNote" maxlength="200"></textarea>
  <button type="button" class="btn wa big" id="shSend"></button>
  <div class="row"><button type="button" class="btn ghost" id="shCancel" data-t="cancel"></button></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const COACH_WA='96176939848';
const KEY='mh_private_sessions_v1', LKEY='mh_private_sessions_lang';
const PACKS=[12,16,20,24];
const $=id=>document.getElementById(id);
const TX={
 pickT:['Choose your <em>session package</em>','اختر <em>باقة الحصص</em>'],
 pickP:['Private online training with Coach Mahmoud Hamad. Choose the package you subscribed to.','التدريب الخاص أونلاين مع المدرّب محمود حمد. اختر الباقة التي اشتركت بها.'],
 sessionsWord:['sessions','حصة'],
 pkD:['≈ $W weeks at 3 / week','≈ W أسابيع بمعدّل 3 حصص أسبوعيًا'],
 regT:['Your details — <em>N sessions</em>','بياناتك — <em>باقة N حصة</em>'],
 regP:['Fill in your details once. They are saved on your phone and sent to the coach.','املأ بياناتك مرّة واحدة؛ تُحفَظ على هاتفك وتُرسَل إلى المدرّب.'],
 fName:['Full name','الاسم الكامل'],fAge:['Age','العمر'],fGender:['Gender','الجنس'],fWeight:['Weight (kg)','الوزن (كغ)'],fHeight:['Height (cm)','الطول (سم)'],
 fGoal:['Main goal','الهدف الأساسي'],fLevel:['Training level','مستوى التمرين'],fDays:['Sessions per week','عدد الحصص أسبوعيًا'],fInj:['Injuries, pain or notes (optional)','إصابات أو آلام أو ملاحظات (اختياري)'],
 choose:['Choose…','اختر…'],
 regBtn:['💬 Save and send to the coach','💬 احفظ وأرسل إلى المدرّب'],back:['← Change package','→ تغيير الباقة'],
 missing:['Please fill in the required fields.','يرجى تعبئة الحقول المطلوبة.'],
 sessions:['sessions','حصة'],
 gridT:['Your sessions','حصصك'],logT:['Session log','سجلّ الحصص'],noLog:['No sessions completed yet — your first one is waiting!','لم تُنجز أي حصة بعد — حصتك الأولى بانتظارك!'],
 completeBtn:['✓ I finished session N','✓ أنهيت الحصة N'],
 shT:['Session N of M 💪','الحصة N من M 💪'],
 shP:['Well done! Tell the coach how it went — WhatsApp opens with the message ready, just press send.','أحسنت! أخبر المدرّب كيف كانت الحصة — سيفتح واتساب والرسالة جاهزة، فقط اضغط إرسال.'],
 feelL:['How did you feel?','كيف كان شعورك؟'],noteL:['Note for the coach (optional)','ملاحظة للمدرّب (اختياري)'],
 shSend:['💬 Save and send on WhatsApp','💬 احفظ وأرسل عبر واتساب'],cancel:['Cancel','إلغاء'],
 doneT:['Package complete!','أنهيت الباقة كاملة!'],doneP:['Amazing commitment. Send your final report to the coach and ask about your next package.','التزام رائع! أرسل تقريرك النهائي إلى المدرّب واسأله عن باقتك التالية.'],
 sendFinal:['💬 Send the final report','💬 أرسل التقرير النهائي'],newPk:['Start a new package','ابدأ باقة جديدة'],
 undo:['Undo last session','تراجع عن آخر حصة'],edit:['Edit my details','تعديل بياناتي'],reset:['Change package','تغيير الباقة'],
 undoQ:['Undo session N? It will be marked as not done.','هل تريد التراجع عن الحصة N؟ ستُعَدّ غير منجزة.'],
 resetQ:['Start over with a new package? Your current progress on this phone will be cleared.','البدء بباقة جديدة؟ سيُمسح تقدّمك الحالي من هذا الهاتف.'],
 newQ:['Start a new package? The finished package will be cleared from this phone.','بدء باقة جديدة؟ ستُمسح الباقة المنتهية من هذا الهاتف.'],
 saved:['Saved ✓ — opening WhatsApp…','تم الحفظ ✓ — جارٍ فتح واتساب…'],
 note:['📱 Your sessions are saved on this phone. Tap Share → “Add to Home Screen” to open this page like an app.','📱 تُحفَظ حصصك على هذا الهاتف. أضف هذه الصفحة إلى الشاشة الرئيسية لتفتحها مثل التطبيق.'],
 coach:['Coach Mahmoud Hamad · MH ELITE PRO','المدرّب محمود حمد · MH ELITE PRO'],
 today:['Today','اليوم']
};
const OPT={
 gender:[['m','Male','ذكر'],['f','Female','أنثى']],
 goal:[['fat','Fat loss','خسارة الدهون'],['muscle','Build muscle','بناء العضل'],['tone','Tone & fitness','شدّ الجسم واللياقة'],['strength','Strength','زيادة القوة'],['health','Health & mobility','الصحة والحركة'],['rehab','Pain / injury recovery','التعافي من ألم أو إصابة']],
 level:[['beg','Beginner','مبتدئ'],['int','Intermediate','متوسط'],['adv','Advanced','متقدّم']],
 days:[['2','2','2'],['3','3','3'],['4','4','4'],['5','5','5']]
};
const FEEL=[['😫','Very hard','صعبة جدًا'],['😮‍💨','Hard','صعبة'],['🙂','Good','جيّدة'],['💪','Strong','قويّة'],['🔥','Excellent','ممتازة']];

let lang=/^ar/i.test(navigator.language||'ar')?'ar':'en';
try{const s=localStorage.getItem(LKEY);if(s==='ar'||s==='en')lang=s}catch(e){}
let S=load(), pendingPack=0, feel=-1, editing=false;

function load(){try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&PACKS.includes(o.pack)&&Array.isArray(o.done))return o}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast(lang==='ar'?'تعذّر الحفظ على هذا الهاتف':'Could not save on this phone');return false}}
const t=k=>(TX[k]||['',''])[lang==='ar'?1:0];
const tr=(k,map)=>{let v=t(k);for(const m in map)v=v.split(m).join(map[m]);return v};
const opt=(g,v)=>{const o=OPT[g].find(x=>x[0]===v);return o?o[lang==='ar'?2:1]:''};
const arN=n=>n===1?'حصة واحدة':n===2?'حصتان':(n>=3&&n<=10)?n+' حصص':n+' حصة';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(iso,withTime){const d=new Date(iso);if(isNaN(d))return '';try{return d.toLocaleDateString(lang==='ar'?'ar-LB-u-nu-latn':'en-GB',withTime?{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'short',year:'numeric'})}catch(e){return d.toISOString().slice(0,10)}}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),3200)}
function openWA(text){
 const url='https://wa.me/'+COACH_WA+'?text='+encodeURIComponent(text);
 const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}
function fillSelect(el,g,val){el.innerHTML='<option value="">'+esc(t('choose'))+'</option>'+OPT[g].map(o=>'<option value="'+o[0]+'"'+(o[0]===val?' selected':'')+'>'+esc(o[lang==='ar'?2:1])+'</option>').join('')}

/* ---------- messages (sent in the client's language) ---------- */
function profileLines(p){
 const ar=lang==='ar',L=[];
 L.push((ar?'👤 الاسم: ':'👤 Name: ')+p.name);
 L.push((ar?'🎂 العمر: ':'🎂 Age: ')+p.age+(ar?' · ':' · ')+opt('gender',p.gender));
 L.push((ar?'⚖️ الوزن: ':'⚖️ Weight: ')+p.weight+(ar?' كغ':' kg')+(p.height?(ar?' · الطول: ':' · Height: ')+p.height+(ar?' سم':' cm'):''));
 L.push((ar?'🎯 الهدف: ':'🎯 Goal: ')+opt('goal',p.goal));
 if(p.level)L.push((ar?'📶 المستوى: ':'📶 Level: ')+opt('level',p.level));
 if(p.days)L.push((ar?'📅 حصص أسبوعيًا: ':'📅 Sessions / week: ')+p.days);
 if(p.inj)L.push((ar?'🩹 ملاحظات: ':'🩹 Notes: ')+p.inj);
 return L;
}
function msgRegister(){
 const ar=lang==='ar';
 return [(ar?'🏋️ MH ELITE PRO — تسجيل تدريب خاص':'🏋️ MH ELITE PRO — Private training registration'),
  (ar?'📦 الباقة: '+S.pack+' حصة':'📦 Package: '+S.pack+' sessions'),'',...profileLines(S.profile),'',
  (ar?'📆 تاريخ البدء: ':'📆 Start date: ')+fmtDate(S.start)].join('\n');
}
function msgSession(rec){
 const ar=lang==='ar',n=S.done.length,left=S.pack-n,f=FEEL[rec.feel];
 const L=[(ar?'✅ أنهيت الحصة '+n+' من '+S.pack:'✅ Session '+n+' of '+S.pack+' completed'),
  (ar?'👤 ':'👤 ')+S.profile.name,
  (ar?'📅 ':'📅 ')+fmtDate(rec.at,true)];
 if(f)L.push((ar?'💬 الشعور: ':'💬 Feeling: ')+f[0]+' '+f[ar?2:1]);
 if(rec.note)L.push((ar?'📝 ملاحظة: ':'📝 Note: ')+rec.note);
 L.push(left>0?(ar?'⏳ المتبقي: '+arN(left):'⏳ Remaining: '+left+' sessions'):(ar?'🏆 أنهيت الباقة كاملة!':'🏆 Package complete!'));
 return L.join('\n');
}
function msgFinal(){
 const ar=lang==='ar',d=S.done,first=d[0],last=d[d.length-1];
 const fs=d.filter(x=>x.feel>=0),avg=fs.length?Math.round(fs.reduce((a,x)=>a+x.feel,0)/fs.length):-1;
 const L=[(ar?'🏆 MH ELITE PRO — تقرير نهاية الباقة':'🏆 MH ELITE PRO — Package final report'),
  (ar?'👤 ':'👤 ')+S.profile.name,
  (ar?'📦 الباقة: '+S.pack+' حصة — أُنجزت كاملة ✅':'📦 Package: '+S.pack+' sessions — all completed ✅'),
  (ar?'📆 من ':'📆 From ')+fmtDate(first.at)+(ar?' إلى ':' to ')+fmtDate(last.at)];
 if(avg>=0)L.push((ar?'💬 متوسط الشعور: ':'💬 Average feeling: ')+FEEL[avg][0]+' '+FEEL[avg][ar?2:1]);
 L.push('',ar?'أرغب بالاشتراك في باقة جديدة 🙌':'I would like to continue with a new package 🙌');
 return L.join('\n');
}

/* ---------- views ---------- */
function show(v){['vPick','vReg','vTrack'].forEach(x=>$(x).hidden=x!==v);window.scrollTo(0,0)}
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.title=lang==='ar'?'MH ELITE PRO — الحصص الخاصة':'MH ELITE PRO — Private sessions';
 $('lang').textContent=lang==='ar'?'English':'عربي';
 document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(/<[a-z]/i.test(v))e.innerHTML=v;else e.textContent=v});
 if(!S||editing){
  if(!S&&!pendingPack){renderPick();show('vPick')}
  else{renderReg();show('vReg')}
 }else{renderTrack();show('vTrack')}
}
function renderPick(){
 $('pk').innerHTML=PACKS.map(n=>'<button type="button" data-n="'+n+'"><span class="n">'+n+'</span><span class="l">'+esc(t('sessionsWord'))+'</span><span class="d">'+esc(tr('pkD',{W:Math.round(n/3)}))+'</span></button>').join('');
}
function renderReg(){
 const pack=editing&&S?S.pack:pendingPack, p=(editing&&S?S.profile:readForm())||{};
 $('regT').innerHTML=tr('regT',{N:pack});
 fillSelect($('fGender'),'gender',p.gender||'');fillSelect($('fGoal'),'goal',p.goal||'');fillSelect($('fLevel'),'level',p.level||'');fillSelect($('fDays'),'days',p.days||'');
 if(p.name!=null){$('fName').value=p.name||'';$('fAge').value=p.age||'';$('fWeight').value=p.weight||'';$('fHeight').value=p.height||'';$('fInj').value=p.inj||''}
 document.querySelector('#reg .btn.gold').textContent=editing&&S?(lang==='ar'?'💾 حفظ التعديلات':'💾 Save changes'):t('regBtn');
 if(editing&&S)$('back').textContent=lang==='ar'?'إلغاء':'Cancel';
}
function readForm(){
 const v=id=>($(id).value||'').trim();
 return {name:v('fName'),age:v('fAge'),gender:v('fGender'),weight:v('fWeight'),height:v('fHeight'),goal:v('fGoal'),level:v('fLevel'),days:v('fDays'),inj:v('fInj')};
}
function renderTrack(){
 const n=S.done.length,N=S.pack,C=2*Math.PI*52,finished=n>=N;
 $('cnt').textContent=n+' / '+N;
 const a=$('arc');a.style.strokeDasharray=C;a.style.strokeDashoffset=C*(1-n/N);
 const p=S.profile;
 $('wName').textContent=p.name;
 $('wInfo').textContent=[opt('goal',p.goal),p.weight+(lang==='ar'?' كغ':' kg')].filter(Boolean).join(' · ');
 $('wPk').textContent=(lang==='ar'?'باقة '+N+' حصة':N+'-session package')+' · '+fmtDate(S.start);
 $('grid').innerHTML=Array.from({length:N},(_,i)=>'<div class="cell'+(i<n?' done':i===n?' next':'')+'">'+(i+1)+'</div>').join('');
 $('complete').hidden=finished;$('complete').textContent=tr('completeBtn',{N:n+1});
 $('doneBox').hidden=!finished;$('sendFinal').textContent=t('sendFinal');
 $('undo').hidden=n===0;
 $('log').innerHTML=n?S.done.map((r,i)=>({r,i})).reverse().map(({r,i})=>'<li><span class="no">'+(i+1)+'</span><span class="tx">'+esc(fmtDate(r.at,true))+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</span><span class="fe">'+(FEEL[r.feel]?FEEL[r.feel][0]:'')+'</span></li>').join(''):'<li class="empty">'+esc(t('noLog'))+'</li>';
}

/* ---------- events ---------- */
$('lang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem(LKEY,lang)}catch(e){}
 const keep=!$('vReg').hidden?readForm():null;render();
 if(keep){$('fName').value=keep.name;$('fAge').value=keep.age;$('fWeight').value=keep.weight;$('fHeight').value=keep.height;$('fInj').value=keep.inj;$('fGender').value=keep.gender;$('fGoal').value=keep.goal;$('fLevel').value=keep.level;$('fDays').value=keep.days}
 if(!$('ov').hidden)renderSheet();
});
$('pk').addEventListener('click',e=>{const b=e.target.closest('button[data-n]');if(!b)return;pendingPack=+b.dataset.n;
 ['fName','fAge','fWeight','fHeight','fInj'].forEach(id=>$(id).value='');render()});
$('back').addEventListener('click',()=>{if(editing&&S){editing=false;render();return}pendingPack=0;render()});
$('reg').addEventListener('submit',e=>{
 e.preventDefault();
 const f=readForm(),bad=[];
 const age=+f.age,w=+f.weight,h=f.height?+f.height:0;
 if(!f.name)bad.push('fName');
 if(!(age>=10&&age<=90))bad.push('fAge');
 if(!f.gender)bad.push('fGender');
 if(!(w>=25&&w<=300))bad.push('fWeight');
 if(f.height&&!(h>=100&&h<=230))bad.push('fHeight');
 if(!f.goal)bad.push('fGoal');
 document.querySelectorAll('#reg .err').forEach(x=>x.classList.remove('err'));
 if(bad.length){bad.forEach(id=>$(id).classList.add('err'));$(bad[0]).focus();toast(t('missing'));return}
 f.age=String(age);f.weight=String(w);if(f.height)f.height=String(h);
 if(editing&&S){S.profile=f;editing=false;save();render();toast(lang==='ar'?'تم حفظ التعديلات ✓':'Changes saved ✓');return}
 S={v:1,pack:pendingPack,start:new Date().toISOString(),profile:f,done:[]};pendingPack=0;
 if(!save()){S=null;return}
 render();toast(t('saved'));setTimeout(()=>openWA(msgRegister()),250);
});
document.getElementById('reg').addEventListener('input',e=>e.target.classList.remove('err'));

function renderSheet(){
 const n=S.done.length+1;
 $('shT').textContent=tr('shT',{N:n,M:S.pack});
 $('feel').innerHTML=FEEL.map((f,i)=>'<button type="button" data-i="'+i+'" class="'+(i===feel?'on':'')+'">'+f[0]+'<small>'+esc(f[lang==='ar'?2:1])+'</small></button>').join('');
 $('shSend').textContent=t('shSend');
 document.querySelectorAll('#ov [data-t]').forEach(e=>e.textContent=t(e.dataset.t));
}
function openSheet(){feel=-1;$('sNote').value='';renderSheet();$('ov').hidden=false;document.body.style.overflow='hidden'}
function closeSheet(){$('ov').hidden=true;document.body.style.overflow=''}
$('complete').addEventListener('click',()=>{if(S&&S.done.length<S.pack)openSheet()});
$('feel').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;feel=+b.dataset.i;renderSheet()});
$('shCancel').addEventListener('click',closeSheet);
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))closeSheet()});
$('shSend').addEventListener('click',()=>{
 if(!S||S.done.length>=S.pack){closeSheet();return}
 const rec={at:new Date().toISOString(),feel:feel,note:($('sNote').value||'').trim()};
 S.done.push(rec);
 if(!save()){S.done.pop();return}
 closeSheet();render();toast(t('saved'));
 const text=msgSession(rec);setTimeout(()=>openWA(text),250);
});
$('sendFinal').addEventListener('click',()=>openWA(msgFinal()));
$('undo').addEventListener('click',()=>{if(!S||!S.done.length)return;if(!confirm(tr('undoQ',{N:S.done.length})))return;S.done.pop();save();render()});
$('edit').addEventListener('click',()=>{editing=true;render()});
function startOver(q){if(!confirm(q))return;S=null;pendingPack=0;editing=false;try{localStorage.removeItem(KEY)}catch(e){}render()}
$('reset').addEventListener('click',()=>startOver(t('resetQ')));
$('newPk').addEventListener('click',()=>startOver(t('newQ')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').hidden)closeSheet()});

$('logo').src=$('icon').href;
render();
})();
</script>
</body>
</html>
