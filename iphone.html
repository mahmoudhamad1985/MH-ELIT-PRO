<title>MH ELITE PRO — تطبيق الآيفون</title>
<style>
:root{--line:#223044;--mut:#93a3b8;--gold:#f5c842;--green:#3ddc84;--blue:#4fc3f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 80% 45% at 50% 0,rgba(245,200,66,.2),transparent 70%),linear-gradient(180deg,#07101c,#030509);color:#f6f8fb;font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55;padding:max(14px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom))}
.wrap{width:min(520px,100%);margin:auto}
.top{display:flex;align-items:center;gap:10px}
.top b{font-size:15px;letter-spacing:.3px}.top b span{color:var(--gold)}
.top .sp{flex:1}
.lang{border:1px solid #2e4058;background:#0d1622;color:#dbe6f3;border-radius:999px;padding:7px 13px;font-weight:700;font-size:12px;cursor:pointer}
.hero{text-align:center;margin-top:22px}
.hero img{width:112px;height:112px;border-radius:28px;box-shadow:0 0 0 2px rgba(245,200,66,.5),0 16px 40px rgba(245,200,66,.3)}
.plat{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:7px 16px;border-radius:999px;font-weight:800;font-size:14px}
.plat.android{background:linear-gradient(135deg,#3ddc84,#1fa864);color:#04220f}
.plat.iphone{background:linear-gradient(135deg,#f3f6fb,#c9d3df);color:#0b0f16}
.plat svg{width:20px;height:20px}
h1{font-size:28px;line-height:1.25;margin:12px 0 6px}
h1 em{font-style:normal;color:var(--gold)}
.sub{color:#c3cfdd;font-size:14.5px;margin:0 auto;max-width:420px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;border:0;border-radius:18px;padding:18px;font-weight:900;font-size:18px;text-decoration:none;cursor:pointer;min-height:60px}
.cta.android{background:linear-gradient(135deg,#6ff0a8,#3ddc84 50%,#1fa864);color:#04220f;box-shadow:0 14px 34px rgba(61,220,132,.3)}
.cta.iphone{background:linear-gradient(135deg,#ffe08a,#f5c842 50%,#d9a93a);color:#1a1200;box-shadow:0 14px 34px rgba(245,200,66,.3)}
.meta{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
.warn{margin-top:16px;padding:14px;border-radius:16px;border:1px solid rgba(255,180,84,.55);background:rgba(255,180,84,.1);color:#ffe2b8;font-size:13.5px}
.warn b{display:block;margin-bottom:4px}
.warn button,.warn a{display:inline-block;margin-top:10px;border:1px solid rgba(255,180,84,.6);background:transparent;color:#ffe2b8;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.steps{margin-top:22px;padding:16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(150deg,#101a28,#090f18)}
.steps h2{font-size:15px;margin:0 0 12px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.step:first-of-type{border-top:0}
.step i{flex:none;font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--gold);color:#1a1200}
.step b{display:block;font-size:14.5px}
.step small{display:block;color:#b5c2d2;font-size:12.5px;margin-top:2px}
.kbd{display:inline-block;padding:1px 7px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:12px;white-space:nowrap}
.note{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(79,195,247,.08);border:1px solid rgba(79,195,247,.3);color:#cfeaf8;font-size:12.5px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:22px}
.foot a{color:#dce6f2}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#163426;color:#bff7d8;border:1px solid #36d98b66;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;transition:.2s;z-index:50;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
</style>
</head>
