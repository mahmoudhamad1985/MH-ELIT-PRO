<style>
:root{
  --bg:#050507; --bg2:#0b0b10;
  --gold:#f3cf6c; --gold2:#c9962f; --gold3:#fff3d1; --gold-soft:rgba(243,207,108,.16);
  --txt:#f8f5ec; --mut:#a8a3b5; --line:rgba(243,207,108,.2);
  --green:#34d399; --green2:#0f8f5c; --silver:#e7ebf2; --silver2:#9aa3b2; --glass:rgba(255,255,255,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(ellipse 100% 42% at 50% -10%, rgba(243,207,108,.24), transparent 62%),
    radial-gradient(ellipse 70% 34% at 96% 8%, rgba(255,243,209,.08), transparent 55%),
    radial-gradient(ellipse 75% 38% at 88% 108%, rgba(154,163,178,.14), transparent 62%),
    radial-gradient(ellipse 55% 30% at -8% 46%, rgba(243,207,108,.07), transparent 60%),
    linear-gradient(180deg,#0a0a0e,var(--bg) 42%,#020203);
  color:var(--txt);
  font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  line-height:1.6;
  padding:max(16px,env(safe-area-inset-top)) 18px calc(120px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:26px 26px}
.wrap{width:min(540px,100%);margin:auto;position:relative;z-index:1}

/* ── Top bar ── */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Cairo","Tajawal",sans-serif;font-weight:900;font-size:15px;letter-spacing:.6px}
.brand .mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold3),var(--gold) 45%,var(--gold2) 80%,#8a6112);
  color:#1c1405;font-size:15px;box-shadow:0 6px 18px rgba(243,207,108,.4), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 3px rgba(0,0,0,.25)}
.brand span em{font-style:normal;background:linear-gradient(90deg,var(--gold3),#e8b93f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lang{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:#ecdfc0;
  border-radius:999px;padding:8px 16px;font-weight:800;font-size:12.5px;cursor:pointer;
  transition:.25s;box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04)}
.lang:active{transform:scale(.95)}

/* ── Hero ── */
.hero{text-align:center;margin-top:10px}
.icon-frame{position:relative;width:136px;height:136px;margin:0 auto}
.icon-frame::before{content:"";position:absolute;inset:-10px;border-radius:36px;
  background:conic-gradient(from 0deg,var(--gold3),var(--gold2),#fff8e0,#8a6112,var(--gold3));
  animation:spin 8s linear infinite;opacity:.95}
.icon-frame::after{content:"";position:absolute;inset:-16px;border-radius:40px;
  background:conic-gradient(from 0deg,var(--gold3),var(--gold2),#fff8e0,#8a6112,var(--gold3));
  animation:spin 8s linear infinite;filter:blur(28px);opacity:.65}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-frame img{position:relative;z-index:1;width:136px;height:136px;border-radius:28px;display:block;
  box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.1)}
.badge-float{position:absolute;z-index:2;background:linear-gradient(150deg,rgba(24,24,30,.92),rgba(11,11,16,.92));
  backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:800;color:#f2e8cc;
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);animation:bob 3.6s ease-in-out infinite;white-space:nowrap}
.badge-float b{color:var(--gold3)}
.b1{top:6px;inset-inline-start:-24px}
.b2{bottom:14px;inset-inline-end:-30px;animation-delay:1.8s;border-color:rgba(52,211,153,.42);color:#e3fff2}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.plat{display:inline-flex;align-items:center;gap:8px;margin-top:26px;padding:7px 18px;border-radius:999px;
  font-weight:900;font-size:12.5px;letter-spacing:1.2px;
  background:linear-gradient(135deg,rgba(231,235,242,.18),rgba(231,235,242,.04));
  border:1px solid rgba(231,235,242,.35);color:#eef1f6;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.plat svg{width:17px;height:17px}

h1{font-family:"Cairo","Tajawal",sans-serif;font-size:clamp(27px,7.4vw,34px);line-height:1.35;margin:16px 0 8px;font-weight:900}
h1 .gold{background:linear-gradient(92deg,var(--gold3),var(--gold) 35%,var(--gold2) 65%,var(--gold3));
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmerText 7s linear infinite}
@keyframes shimmerText{to{background-position:220% center}}
.sub{color:#c6c0d2;font-size:15px;margin:0 auto;max-width:400px}

.perks{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}
.perk{font-size:12px;font-weight:700;color:#ece3c9;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(243,207,108,.18);
  border-radius:999px;padding:7px 14px;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ── Alerts ── */
.alert{margin-top:20px;padding:15px 16px;border-radius:18px;font-size:13.5px;text-align:start;
  border:1px solid rgba(255,196,107,.4);background:linear-gradient(150deg,rgba(255,196,107,.12),rgba(255,196,107,.04));
  color:#ffe8c2;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.alert b{display:block;margin-bottom:3px;font-size:14px}
.alert button,.alert a{display:inline-block;margin-top:11px;border:0;background:linear-gradient(135deg,#ffd88a,#e8b23f);
  color:#241a05;border-radius:12px;padding:10px 18px;font-weight:900;font-size:13px;text-decoration:none;cursor:pointer;
  box-shadow:0 6px 18px rgba(240,180,60,.3);transition:.2s}
.alert button:active,.alert a:active{transform:scale(.96)}

/* ── CTA ── */
.cta-zone{margin-top:28px}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  border:0;border-radius:22px;padding:20px;font-weight:900;font-size:19px;text-decoration:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold3),var(--gold) 45%,var(--gold2) 100%);color:#1c1405;
  box-shadow:0 20px 50px rgba(243,207,108,.32), 0 0 0 1px rgba(255,255,255,.18) inset, inset 0 1px 0 rgba(255,255,255,.6);
  transition:.25s;overflow:hidden;min-height:64px}
.cta .shine{position:absolute;top:0;bottom:0;width:60%;inset-inline-start:-70%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.6),transparent);
  animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%{inset-inline-start:-70%}55%,100%{inset-inline-start:130%}}
.cta:active{transform:scale(.975)}
.cta svg{width:24px;height:24px;flex:none}
.cta small{display:block;font-size:11.5px;font-weight:700;opacity:.75;letter-spacing:.3px}
.pulse{position:absolute;inset:0;border-radius:22px;box-shadow:0 0 0 0 rgba(243,207,108,.5);animation:pulse 2.4s infinite;pointer-events:none}
@keyframes pulse{70%{box-shadow:0 0 0 18px rgba(243,207,108,0)}100%{box-shadow:0 0 0 0 rgba(243,207,108,0)}}
.meta{text-align:center;color:var(--mut);font-size:12px;margin-top:11px}

/* ── Steps ── */
.steps{margin-top:32px;padding:22px 20px;border-radius:24px;border:1px solid var(--line);
  background:linear-gradient(160deg,rgba(243,207,108,.08),var(--glass) 40%,rgba(255,255,255,.015));
  backdrop-filter:blur(14px);box-shadow:0 28px 72px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05)}
.steps h2{font-family:"Cairo","Tajawal",sans-serif;font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.steps h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.step{display:flex;gap:14px;align-items:flex-start;padding:15px 2px;position:relative}
.step+.step{border-top:1px solid rgba(255,255,255,.06)}
.step i{flex:none;font-style:normal;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:16px;
  background:linear-gradient(135deg,var(--gold3),var(--gold) 55%,var(--gold2));color:#1a1305;
  box-shadow:0 8px 20px rgba(243,207,108,.35), inset 0 1px 0 rgba(255,255,255,.65)}
.step b{display:block;font-size:15px}
.step small{display:block;color:#b3adbf;font-size:12.8px;margin-top:3px}
.kbd{display:inline-block;padding:1px 8px;border-radius:8px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);font-weight:800;font-size:11.5px;white-space:nowrap;color:#ffe9b0}

.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
.foot a{color:#e6dcbf;font-weight:700;text-decoration:none;border-bottom:1px dotted rgba(243,207,108,.5)}

/* ── Floating bar ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,rgba(2,2,3,.94) 40%);backdrop-filter:blur(8px)}
.dock-in{width:min(540px,100%);margin:auto;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg,rgba(26,26,32,.95),rgba(14,14,18,.95));border:1px solid var(--line);border-radius:20px;padding:10px 12px;
  box-shadow:0 20px 56px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05)}
.dock-in .ic{width:42px;height:42px;border-radius:12px;flex:none}
.dock-in .tx{flex:1;min-width:0}
.dock-in .tx b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-in .tx small{display:block;font-size:11px;color:var(--mut)}
.dock-btn{flex:none;border:0;border-radius:14px;padding:12px 20px;font-weight:900;font-size:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--gold3),var(--gold) 55%,var(--gold2));color:#1c1405;
  box-shadow:0 8px 22px rgba(243,207,108,.38);transition:.2s;text-decoration:none}
.dock-btn:active{transform:scale(.94)}

<script>
(function(){
'use strict';
const TX={

 "more":["About MH ELITE PRO →","تعرّف على MH ELITE PRO ←"],

 "sub":["It installs from Safari in seconds and works like an app — even offline.","يُثبَّت من Safari خلال ثوانٍ ويعمل مثل التطبيق — حتى بدون إنترنت."],

 "cta":["Open the app","فتح التطبيق"],
 "ctaSub":["Then add it to your home screen","وبعدها أضفه للشاشة الرئيسية"],
 "meta":["iPhone • Safari • free 3-day trial when you first open it","آيفون • Safari • تجربة مجانية 3 أيام عند أول فتح"],
 "dockSub":["Add to home screen — free","أضفه للشاشة الرئيسية — مجانًا"],
 "dockBtn":["Open","فتح"],
 "stepsT":["How to add it to your home screen","طريقة إضافته إلى الشاشة الرئيسية"],
 "wOtherT":["This page is for iPhone","هذه الصفحة للآيفون"],
 "wOtherP":["You are on Android. Use the Android page to download the app.","أنت تستخدم أندرويد. استخدم صفحة الأندرويد لتحميل التطبيق."],
 "wOtherBtn":["🤖 Open the Android page","🤖 فتح صفحة الأندرويد"],
 "wSafT":["Open this page in Safari","افتح هذه الصفحة في Safari"],
 "wSafP":["Adding to the home screen works only from Safari. Copy the link and paste it in Safari.","الإضافة إلى الشاشة الرئيسية تعمل فقط من Safari. انسخ الرابط والصقه في Safari."]
},
STEPS=[
 [
  ["Tap “Open the app”","It opens in Safari. Wait until it loads."],
  ["اضغط «فتح التطبيق»","يفتح في Safari. انتظر حتى يكتمل التحميل."]
 ],
 [
  ["Tap the Share button","The square with an arrow <span class=\"kbd\">⬆️</span> at the bottom of Safari."],
  ["اضغط زر المشاركة","المربع مع السهم <span class=\"kbd\">⬆️</span> أسفل Safari."]
 ],
 [
  ["Choose “Add to Home Screen”","Scroll down the list to find it <span class=\"kbd\">➕</span>."],
  ["اختر «إضافة إلى الشاشة الرئيسية»","مرّر القائمة للأسفل لتجدها <span class=\"kbd\">➕</span>."]
 ],
 [
  ["Tap “Add”","Open MH ELITE PRO from the new icon — not from Safari."],
  ["اضغط «إضافة»","افتح MH ELITE PRO من الأيقونة الجديدة — وليس من Safari."]
 ]
],
PLAT='iphone';

const $=id=>document.getElementById(id);
const UA=navigator.userAgent||'';
const isIOS=/iP(hone|ad|od)/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/i.test(UA);
const notSafari=isIOS&&/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Instagram|FBAN|FBAV|Line\/|Snapchat|TikTok/i.test(UA);
let lang=/^ar/i.test(navigator.language||'ar')?'ar':'en';
try{const s=localStorage.getItem('mh_get_lang');if(s==='ar'||s==='en')lang=s}catch(e){}
const t=k=>(TX[k]||['',''])[lang==='ar'?1:0];
const ar=()=>lang==='ar';

function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=ar()?'rtl':'ltr';
  document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>{const v=t(e.dataset.t);if(/<[a-z]/i.test(v))e.innerHTML=v;else e.textContent=v});
  $('lang').textContent=ar()?'English':'عربي';
  $('steps').innerHTML=STEPS.map((s,i)=>{
    const st=s[ar()?1:0];
    return '<div class="step"><i>'+(i+1)+'</i><div><b>'+st[0]+'</b><small>'+st[1]+'</small></div></div>';
  }).join('');
}

function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),4200)}

$('lang').addEventListener('click',()=>{lang=ar()?'en':'ar';try{localStorage.setItem('mh_get_lang',lang)}catch(e){}render()});

if(PLAT==='iphone'&&isAndroid)$('warnOther').hidden=false;
if(PLAT==='iphone'&&notSafari)$('warnSafari').hidden=false;

try{if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{})}catch(e){}

function openApp(ev){
  if(ev)ev.preventDefault();
  location.href=new URL('MH-ELITE-PRO.html',location.href).href;
}
$('cta').addEventListener('click',openApp);
$('dockBtn').addEventListener('click',openApp);

$('copy').addEventListener('click',async()=>{
  const u=location.href.split('#')[0];let ok=false;
  try{await navigator.clipboard.writeText(u);ok=true}catch(e){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}
  toast(ok?t('copied'):u);
});

render();
})();
</script>
